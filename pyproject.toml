[tool.mypy]
python_version = "3.12"
mypy_path = [".", "scripts"]
files = ["scripts", "tests", "evals", "examples", "skills"]
explicit_package_bases = true
namespace_packages = true
show_error_codes = true
exclude = [
    "^skills[\\\\/]repo-audit-synthesis[\\\\/]scripts[\\\\/]audit_to_sarif\\.py$",
    "^skills[\\\\/][^\\\\/]+[\\\\/]scripts[\\\\/]validate_(?:audit|workflow|architecture|review|testing|spec|output)\\.py$",
]

[[tool.mypy.overrides]]
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]
norecursedirs = [
    ".git",
    ".venv",
    "dist",
    "evals",
    "examples",
    "oracles",
    "shared",
    "skills",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".fred-skills",
]
