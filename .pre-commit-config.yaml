default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Lint Python sources with Ruff
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Check Python formatting with Ruff
        entry: ruff format --check
        language: system
        types_or: [python, markdown]
      - id: mypy
        name: Check Python static types with mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: sync-audit-resources
        name: Check shared resource copies
        entry: python scripts/sync_audit_resources.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: build-catalog
        name: Check discovery indexes
        entry: python scripts/build_catalog.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: build-experience
        name: Check experience documentation
        entry: python scripts/build_experience.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: validate-skills
        name: Validate standalone packages
        entry: python scripts/validate_skills.py --telemetry validation-telemetry.json
        language: system
        pass_filenames: false
        always_run: true
      - id: check-doc-links
        name: Check relative documentation links
        entry: python scripts/check_doc_links.py
        language: system
        pass_filenames: false
        always_run: true
      - id: verify-doc-snippets
        name: Verify documentation command snippets
        entry: python scripts/verify_doc_snippets.py
        language: system
        pass_filenames: false
        always_run: true
      - id: verify-workflow-actions
        name: Verify workflow action pins
        entry: python scripts/verify_workflow_actions.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: unit-tests
        name: Test validation and synthetic contracts
        entry: python scripts/run_checks.py --phase tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
