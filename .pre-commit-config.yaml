repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Lint Python sources with Ruff
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Check Python formatting with Ruff
        entry: ruff format --check
        language: system
        types: [python]
      - id: sync-audit-resources
        name: Check shared resource copies
        entry: python scripts/sync_audit_resources.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: build-catalog
        name: Check discovery indexes
        entry: python scripts/build_catalog.py --check
        language: system
        pass_filenames: false
        always_run: true
      - id: validate-skills
        name: Validate standalone packages
        entry: python scripts/validate_skills.py
        language: system
        pass_filenames: false
        always_run: true
      - id: unit-tests
        name: Test validation and synthetic contracts
        entry: python -m unittest discover -s tests -v
        language: system
        pass_filenames: false
        always_run: true
