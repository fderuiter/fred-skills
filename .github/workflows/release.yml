name: Release

on:
  workflow_run:
    workflows: [Validate skill packages]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to v<VERSION>)'
        type: string
        required: false
      publish:
        description: 'Publish or promote the GitHub Release (false builds read-only workflow artifacts only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: skills-${{ github.workflow }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8

jobs:
  preflight:
    if: >-
      !cancelled() &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        ) ||
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      should_publish: ${{ steps.gate.outputs.should_publish }}
      needs_validation: ${{ steps.gate.outputs.needs_validation }}
      release_tag: ${{ steps.gate.outputs.release_tag }}
      target_sha: ${{ steps.gate.outputs.target_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Evaluate release preflight gate
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -eu

          validate_tag_syntax() {
            CANDIDATE_TAG="$1"
            case "$CANDIDATE_TAG" in
              ""|*[!0-9A-Za-z._+-]*|v)
                echo "Error: Invalid release tag syntax '$CANDIDATE_TAG' (expected v<VERSION>)" >&2
                exit 1
                ;;
              v[0-9]*)
                ;;
              *)
                echo "Error: Invalid release tag syntax '$CANDIDATE_TAG' (expected v<VERSION>)" >&2
                exit 1
                ;;
            esac
            if ! printf '%s' "$CANDIDATE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' || ! git check-ref-format "refs/tags/$CANDIDATE_TAG"; then
              echo "Error: Invalid release tag syntax '$CANDIDATE_TAG' (expected v<VERSION>)" >&2
              exit 1
            fi
          }

          write_summary() {
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### Release Preflight"
                echo "- **Event**: \`${EVENT:-unknown}\` (\`${REF_TYPE:-unknown}:${REF_NAME:-unknown}\`)"
                echo "- **Decision**: $1"
                echo "- **Release tag**: \`${2:-none}\`"
                echo "- **Target SHA**: \`$3\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          if [ -n "${GH_TOKEN:-}" ]; then
            SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"
            SERVER_URL="${SERVER_URL%/}"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH_HEADER"
          fi

          EVENT="${EVENT_NAME:-}"
          PUBLISH_INPUT="${INPUT_PUBLISH:-}"
          PUBLISH_REQUESTED="false"

          if [ "$EVENT" = "workflow_run" ]; then
            if [ "${WORKFLOW_CONCLUSION:-}" != "success" ]; then
              echo "Error: Refusing release preflight for non-successful workflow_run conclusion '${WORKFLOW_CONCLUSION:-none}'" >&2
              exit 1
            fi
            if [ "${WORKFLOW_EVENT:-}" != "push" ]; then
              echo "Error: Refusing release preflight for workflow_run event '${WORKFLOW_EVENT:-none}' (expected push)" >&2
              exit 1
            fi
            if [ "${WORKFLOW_HEAD_BRANCH:-}" != "main" ]; then
              echo "Error: Refusing release preflight for workflow_run branch '${WORKFLOW_HEAD_BRANCH:-none}' (expected main)" >&2
              exit 1
            fi
            PUBLISH_REQUESTED="true"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            case "$PUBLISH_INPUT" in
              true|TRUE|True)
                PUBLISH_REQUESTED="true"
                ;;
              false|FALSE|False|"")
                PUBLISH_REQUESTED="false"
                ;;
              *)
                echo "Error: Invalid publish input '$PUBLISH_INPUT' (expected true or false)" >&2
                exit 1
                ;;
            esac
          elif [ "$EVENT" = "push" ]; then
            PUBLISH_REQUESTED="true"
          else
            case "$PUBLISH_INPUT" in
              true|TRUE|True)
                PUBLISH_REQUESTED="true"
                ;;
              false|FALSE|False)
                PUBLISH_REQUESTED="false"
                ;;
              "")
                if [ "${REF_TYPE:-}" = "tag" ] || { [ "${REF_TYPE:-}" = "branch" ] && [ "${REF_NAME:-}" = "main" ]; }; then
                  PUBLISH_REQUESTED="true"
                fi
                ;;
              *)
                echo "Error: Invalid publish input '$PUBLISH_INPUT' (expected true or false)" >&2
                exit 1
                ;;
            esac
          fi

          if [ "$PUBLISH_REQUESTED" = "false" ]; then
            DISPATCH_TAG="${INPUT_TAG:-}"
            if [ -n "$DISPATCH_TAG" ]; then
              validate_tag_syntax "$DISPATCH_TAG"
              if ! git ls-remote --exit-code --refs origin "refs/tags/$DISPATCH_TAG" >/dev/null 2>&1; then
                echo "Error: Remote tag 'refs/tags/$DISPATCH_TAG' does not exist on origin" >&2
                exit 1
              fi
              git fetch --force --depth=1 origin "refs/tags/$DISPATCH_TAG:refs/tags/$DISPATCH_TAG" >/dev/null 2>&1 || \
                git fetch --force origin "refs/tags/$DISPATCH_TAG:refs/tags/$DISPATCH_TAG" >/dev/null 2>&1
              TARGET_SHA="$(git rev-parse --verify "refs/tags/$DISPATCH_TAG^{commit}")"
            else
              TARGET_SHA="${WORKFLOW_SHA:-${GITHUB_SHA:-}}"
              if [ -z "$TARGET_SHA" ]; then
                TARGET_SHA="$(git rev-parse --verify HEAD)"
              fi
            fi

            if ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Error: Resolved target_sha '$TARGET_SHA' is not a valid 40-character commit SHA" >&2
              exit 1
            fi

            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              {
                echo "should_build=true"
                echo "should_publish=false"
                echo "needs_validation=true"
                echo "release_tag=$DISPATCH_TAG"
                echo "target_sha=$TARGET_SHA"
              } >> "$GITHUB_OUTPUT"
            fi
            write_summary "Build read-only workflow artifacts only (publish=false)" "$DISPATCH_TAG" "$TARGET_SHA"
            exit 0
          fi

          TAG="${INPUT_TAG:-}"
          if [ -n "$TAG" ]; then
            validate_tag_syntax "$TAG"
          elif [ "${REF_TYPE:-}" = "tag" ]; then
            TAG="${REF_NAME:-}"
            validate_tag_syntax "$TAG"
          elif [ "$EVENT" != "workflow_run" ] && { [ "$EVENT" != "push" ] || [ "${REF_TYPE:-}" != "branch" ] || [ "${REF_NAME:-}" != "main" ]; }; then
            if [ ! -s VERSION ] || [ -z "$(tr -d '[:space:]' < VERSION)" ]; then
              echo "Error: VERSION file is missing or empty in repository root" >&2
              exit 1
            fi
            TAG="v$(tr -d '[:space:]' < VERSION)"
            validate_tag_syntax "$TAG"
          fi

          FETCH_ERR_FILE="$(mktemp)"
          VIEW_ERR_FILE="$(mktemp)"
          trap 'rm -f "$FETCH_ERR_FILE" "$VIEW_ERR_FILE"' EXIT
          FETCH_OK="true"
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null || true)" = "true" ]; then
            git fetch --unshallow --tags --force origin "+refs/heads/main:refs/remotes/origin/main" >/dev/null 2>"$FETCH_ERR_FILE" || FETCH_OK="false"
          else
            git fetch --tags --force origin "+refs/heads/main:refs/remotes/origin/main" >/dev/null 2>"$FETCH_ERR_FILE" || FETCH_OK="false"
          fi
          if [ "$FETCH_OK" != "true" ]; then
            echo "Error: Failed to fetch full history and tags for origin/main: $(cat "$FETCH_ERR_FILE")" >&2
            exit 1
          fi

          if [ -z "$TAG" ]; then
            START_SHA="${WORKFLOW_SHA:-${GITHUB_SHA:-}}"
            if [ -z "$START_SHA" ]; then
              START_SHA="$(git rev-parse --verify HEAD)"
            fi
            if ! printf '%s' "$START_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Error: Resolved target_sha '$START_SHA' is not a valid 40-character commit SHA" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$START_SHA" refs/remotes/origin/main >/dev/null 2>&1; then
              echo "Error: Target commit '$START_SHA' is not an ancestor of origin/main" >&2
              exit 1
            fi
            if [ "$(git cat-file -t "$START_SHA:VERSION" 2>/dev/null || true)" != "blob" ]; then
              echo "Error: VERSION file is missing or empty in repository root" >&2
              exit 1
            fi
            START_VERSION="$(git cat-file -p "$START_SHA:VERSION" | tr -d '[:space:]')"
            if [ -z "$START_VERSION" ]; then
              echo "Error: VERSION file is missing or empty in repository root" >&2
              exit 1
            fi
            TAG="v$START_VERSION"
            validate_tag_syntax "$TAG"
          fi

          LS_EXIT=0
          git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1 || LS_EXIT=$?
          if [ "$LS_EXIT" -eq 0 ]; then
            git fetch --force --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1 || \
              git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1
            TARGET_SHA="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          elif [ "$LS_EXIT" -eq 2 ] && { [ "$EVENT" = "workflow_run" ] || { [ "$EVENT" = "push" ] && [ "${REF_TYPE:-}" = "branch" ] && [ "${REF_NAME:-}" = "main" ]; }; }; then
            START_SHA="${WORKFLOW_SHA:-${GITHUB_SHA:-}}"
            if [ -z "$START_SHA" ]; then
              START_SHA="$(git rev-parse --verify HEAD)"
            fi
            if ! printf '%s' "$START_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Error: Resolved target_sha '$START_SHA' is not a valid 40-character commit SHA" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$START_SHA" refs/remotes/origin/main >/dev/null 2>&1; then
              echo "Error: Target commit '$START_SHA' is not an ancestor of origin/main" >&2
              exit 1
            fi
            if [ "$(git cat-file -t "$START_SHA:VERSION" 2>/dev/null || true)" != "blob" ]; then
              echo "Error: VERSION file is missing or empty on main" >&2
              exit 1
            fi
            MAIN_VERSION="$(git cat-file -p "$START_SHA:VERSION" | tr -d '[:space:]')"
            if [ -z "$MAIN_VERSION" ]; then
              echo "Error: VERSION file is missing or empty on main" >&2
              exit 1
            fi
            MAIN_EXPECTED_TAG="v$MAIN_VERSION"
            if [ "$TAG" != "$MAIN_EXPECTED_TAG" ]; then
              echo "Error: Remote tag 'refs/tags/$TAG' does not exist on origin and does not match main VERSION '$MAIN_EXPECTED_TAG'" >&2
              exit 1
            fi
            TARGET_SHA="$(
              git rev-list --first-parent "$START_SHA" | {
                RESOLVED_SHA="$START_SHA"
                while IFS= read -r COMMIT_SHA; do
                  [ -n "$COMMIT_SHA" ] || continue
                  if [ "$(git cat-file -t "$COMMIT_SHA:VERSION" 2>/dev/null || true)" != "blob" ]; then
                    break
                  fi
                  COMMIT_VERSION="$(git cat-file -p "$COMMIT_SHA:VERSION" | tr -d '[:space:]')"
                  if [ "$COMMIT_VERSION" != "$MAIN_VERSION" ]; then
                    break
                  fi
                  RESOLVED_SHA="$COMMIT_SHA"
                done
                printf '%s\n' "$RESOLVED_SHA"
              }
            )"
          elif [ "$LS_EXIT" -eq 2 ]; then
            echo "Error: Remote tag 'refs/tags/$TAG' does not exist on origin" >&2
            exit 1
          else
            echo "Error: Failed to query remote tag 'refs/tags/$TAG' on origin (exit $LS_EXIT)" >&2
            exit "$LS_EXIT"
          fi

          if ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Error: Resolved target_sha '$TARGET_SHA' is not a valid 40-character commit SHA" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TARGET_SHA" refs/remotes/origin/main >/dev/null 2>&1; then
            echo "Error: Target commit '$TARGET_SHA' is not an ancestor of origin/main" >&2
            exit 1
          fi

          if [ "$(git cat-file -t "$TARGET_SHA:LICENSE" 2>/dev/null || true)" != "blob" ]; then
            echo "Error: LICENSE file is missing at target commit $TARGET_SHA" >&2
            exit 1
          fi
          if [ -z "$(git cat-file -p "$TARGET_SHA:LICENSE" | tr -d '[:space:]')" ]; then
            echo "Error: LICENSE file is empty or whitespace at target commit $TARGET_SHA" >&2
            exit 1
          fi

          if [ "$(git cat-file -t "$TARGET_SHA:VERSION" 2>/dev/null || true)" != "blob" ]; then
            echo "Error: VERSION file is missing at target commit $TARGET_SHA" >&2
            exit 1
          fi
          VERSION_AT_TARGET="$(git cat-file -p "$TARGET_SHA:VERSION" | tr -d '[:space:]')"
          if [ -z "$VERSION_AT_TARGET" ]; then
            echo "Error: VERSION file is empty at target commit $TARGET_SHA" >&2
            exit 1
          fi

          EXPECTED_TAG="v$VERSION_AT_TARGET"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Error: Release tag '$TAG' does not match expected tag '$EXPECTED_TAG' based on VERSION at $TARGET_SHA" >&2
            exit 1
          fi

          SHOULD_BUILD="false"
          SHOULD_PUBLISH="false"
          DECISION_TEXT=""
          if VIEW_OUT="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>"$VIEW_ERR_FILE")"; then
            NORMALIZED_VIEW="$(printf '%s' "$VIEW_OUT" | tr -d '[:space:]')"
            case "$NORMALIZED_VIEW" in
              true|*'{"isDraft":true}'*)
                echo "Draft release $TAG found; scheduling build and publication."
                SHOULD_BUILD="true"
                SHOULD_PUBLISH="true"
                DECISION_TEXT="Draft release exists; schedule build and promotion"
                ;;
              false|*'{"isDraft":false}'*)
                echo "Release $TAG is already published; skipping duplicate build and publication."
                SHOULD_BUILD="false"
                SHOULD_PUBLISH="false"
                DECISION_TEXT="Release already published; skip duplicate build and publication"
                ;;
              *)
                echo "Error: Unexpected gh release view output for '$TAG': $VIEW_OUT" >&2
                exit 1
                ;;
            esac
          else
            if grep -Eqi 'release not found|not found|404' "$VIEW_ERR_FILE"; then
              echo "Release $TAG is unpublished; scheduling build and publication."
              SHOULD_BUILD="true"
              SHOULD_PUBLISH="true"
              DECISION_TEXT="Release unpublished; schedule build and publication"
            else
              cat "$VIEW_ERR_FILE" >&2
              exit 1
            fi
          fi

          NEEDS_VALIDATION="true"
          if [ "$EVENT" = "workflow_run" ] && [ -n "${WORKFLOW_RUN_HEAD_SHA:-}" ] && [ "$TARGET_SHA" = "$WORKFLOW_RUN_HEAD_SHA" ]; then
            NEEDS_VALIDATION="false"
          fi

          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            {
              echo "should_build=$SHOULD_BUILD"
              echo "should_publish=$SHOULD_PUBLISH"
              echo "needs_validation=$NEEDS_VALIDATION"
              echo "release_tag=$TAG"
              echo "target_sha=$TARGET_SHA"
            } >> "$GITHUB_OUTPUT"
          fi
          write_summary "$DECISION_TEXT" "$TAG" "$TARGET_SHA"

  validate:
    needs: preflight
    if: >-
      !cancelled() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.should_build == 'true' &&
      needs.preflight.outputs.needs_validation != 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.preflight.outputs.target_sha }}

  build:
    needs: [preflight, validate]
    if: >-
      !cancelled() &&
      needs.preflight.result == 'success' &&
      (
        needs.validate.result == 'success' ||
        (needs.validate.result == 'skipped' && needs.preflight.outputs.needs_validation == 'false')
      ) &&
      needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Fetch full history and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          set -eu
          if [ -n "${GH_TOKEN:-}" ]; then
            SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"
            SERVER_URL="${SERVER_URL%/}"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH_HEADER"
          fi
          FETCH_ERR_FILE="$(mktemp)"
          trap 'rm -f "$FETCH_ERR_FILE"' EXIT
          FETCH_OK="true"
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null || true)" = "true" ]; then
            git fetch --unshallow --tags --force origin "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/*:refs/tags/*" >/dev/null 2>"$FETCH_ERR_FILE" || FETCH_OK="false"
          else
            git fetch --tags --force origin "+refs/heads/main:refs/remotes/origin/main" "+refs/tags/*:refs/tags/*" >/dev/null 2>"$FETCH_ERR_FILE" || FETCH_OK="false"
          fi
          if [ "$FETCH_OK" != "true" ]; then
            echo "Error: Failed to fetch full history and tags in build job: $(cat "$FETCH_ERR_FILE")" >&2
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate source and fixtures
        run: make check
      - name: Package release assets
        run: python scripts/fred.py release --all --output dist/release
      - name: Verify release manifest and checksums
        run: |
          python scripts/fred.py verify-release dist/release/manifest.json
          cd dist/release
          sha256sum -c SHA256SUMS
          sha256sum -c checksums.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-artifacts
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [preflight, validate, build]
    if: >-
      !cancelled() &&
      needs.preflight.result == 'success' &&
      (
        needs.validate.result == 'success' ||
        (needs.validate.result == 'skipped' && needs.preflight.outputs.needs_validation == 'false')
      ) &&
      needs.build.result == 'success' &&
      needs.preflight.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: skills-release-publish-${{ needs.preflight.outputs.release_tag || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release prerequisites
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -eu

          if [ ! -s LICENSE ] || [ -z "$(tr -d '[:space:]' < LICENSE)" ]; then
            echo "Error: LICENSE file is missing or empty in repository root" >&2
            exit 1
          fi

          if [ ! -s VERSION ] || [ -z "$(tr -d '[:space:]' < VERSION)" ]; then
            echo "Error: VERSION file is missing or empty in repository root" >&2
            exit 1
          fi

          if [ -n "${RELEASE_TAG:-}" ] && [ -n "${INPUT_TAG:-}" ] && [ "$RELEASE_TAG" != "$INPUT_TAG" ]; then
            echo "Error: Release tag '$INPUT_TAG' does not match preflight tag '$RELEASE_TAG'" >&2
            exit 1
          fi

          EXPECTED_TAG="v$(tr -d '[:space:]' < VERSION)"
          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="${INPUT_TAG:-}"
          fi
          if [ -z "$TAG" ]; then
            if [ "${REF_TYPE:-}" = "tag" ]; then
              TAG="${REF_NAME:-}"
            else
              TAG="$EXPECTED_TAG"
            fi
          fi

          case "$TAG" in
            ""|*[!0-9A-Za-z._+-]*|v)
              echo "Error: Invalid release tag syntax '$TAG' (expected v<VERSION>)" >&2
              exit 1
              ;;
            v[0-9]*)
              ;;
            *)
              echo "Error: Invalid release tag syntax '$TAG' (expected v<VERSION>)" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' || ! git check-ref-format "refs/tags/$TAG"; then
            echo "Error: Invalid release tag syntax '$TAG' (expected v<VERSION>)" >&2
            exit 1
          fi

          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Error: Release tag '$TAG' does not match expected tag '$EXPECTED_TAG' based on VERSION" >&2
            exit 1
          fi

          TARGET_SHA="${TARGET_SHA:-${GITHUB_SHA:-}}"
          if [ -z "$TARGET_SHA" ] || ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Error: Verified 40-character TARGET_SHA (or GITHUB_SHA) is missing or invalid" >&2
            exit 1
          fi

          HEAD_SHA="$(git rev-parse --verify HEAD 2>/dev/null || true)"
          if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then
            echo "Error: Checked-out HEAD '${HEAD_SHA:-none}' does not match verified target_sha '$TARGET_SHA'" >&2
            exit 1
          fi

          if [ -n "${GH_TOKEN:-}" ]; then
            SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"
            SERVER_URL="${SERVER_URL%/}"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH_HEADER"
          fi

          FETCH_ERR_FILE="$(mktemp)"
          VIEW_ERR_FILE="$(mktemp)"
          trap 'rm -f "$FETCH_ERR_FILE" "$VIEW_ERR_FILE"' EXIT
          FETCH_OK="true"
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null || true)" = "true" ]; then
            git fetch --unshallow --tags --force origin "+refs/heads/main:refs/remotes/origin/main" >/dev/null 2>"$FETCH_ERR_FILE" || FETCH_OK="false"
          else
            git fetch --tags --force origin "+refs/heads/main:refs/remotes/origin/main" >/dev/null 2>"$FETCH_ERR_FILE" || FETCH_OK="false"
          fi
          if [ "$FETCH_OK" != "true" ]; then
            echo "Error: Failed to fetch full history and tags for origin/main: $(cat "$FETCH_ERR_FILE")" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TARGET_SHA" refs/remotes/origin/main >/dev/null 2>&1; then
            echo "Error: Commit '$TARGET_SHA' is not an ancestor of origin/main" >&2
            exit 1
          fi

          if [ "${EVENT_NAME:-}" = "workflow_run" ]; then
            if { [ -n "${WORKFLOW_CONCLUSION:-}" ] && [ "$WORKFLOW_CONCLUSION" != "success" ]; } || \
               { [ -n "${WORKFLOW_EVENT:-}" ] && [ "$WORKFLOW_EVENT" != "push" ]; } || \
               { [ -n "${WORKFLOW_HEAD_BRANCH:-}" ] && [ "$WORKFLOW_HEAD_BRANCH" != "main" ]; }; then
              echo "Error: Refusing release prerequisite check for unverified workflow_run context" >&2
              exit 1
            fi
          fi

          LS_EXIT=0
          git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1 || LS_EXIT=$?
          if [ "$LS_EXIT" -eq 0 ]; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1
            REMOTE_TAG_SHA="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
            if [ "$REMOTE_TAG_SHA" != "$TARGET_SHA" ]; then
              MISMATCH_PUBLISHED="false"
              if { [ "${EVENT_NAME:-}" = "push" ] || [ "${EVENT_NAME:-}" = "workflow_run" ]; } && [ "${REF_TYPE:-}" = "branch" ] && [ "${REF_NAME:-}" = "main" ] && git merge-base --is-ancestor "$REMOTE_TAG_SHA" refs/remotes/origin/main >/dev/null 2>&1; then
                if VIEW_OUT="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>"$VIEW_ERR_FILE")"; then
                  NORMALIZED_VIEW="$(printf '%s' "$VIEW_OUT" | tr -d '[:space:]')"
                  case "$NORMALIZED_VIEW" in
                    false|*'{"isDraft":false}'*)
                      MISMATCH_PUBLISHED="true"
                      ;;
                    true|*'{"isDraft":true}'*)
                      ;;
                    *)
                      echo "Error: Unexpected gh release view output for '$TAG': $VIEW_OUT" >&2
                      exit 1
                      ;;
                  esac
                else
                  if ! grep -Eqi 'release not found|not found|404' "$VIEW_ERR_FILE"; then
                    cat "$VIEW_ERR_FILE" >&2
                    exit 1
                  fi
                fi
              fi
              if [ "$MISMATCH_PUBLISHED" != "true" ]; then
                echo "Error: Remote tag 'refs/tags/$TAG' points to '$REMOTE_TAG_SHA', expected '$TARGET_SHA'" >&2
                exit 1
              fi
            fi
          elif [ "$LS_EXIT" -eq 2 ] && { [ "${EVENT_NAME:-}" = "push" ] || [ "${EVENT_NAME:-}" = "workflow_run" ]; } && [ "${REF_TYPE:-}" = "branch" ] && [ "${REF_NAME:-}" = "main" ]; then
            :
          elif [ "$LS_EXIT" -eq 2 ]; then
            echo "Error: Remote tag 'refs/tags/$TAG' does not exist on origin" >&2
            exit 1
          else
            echo "Error: Failed to query remote tag 'refs/tags/$TAG' on origin (exit $LS_EXIT)" >&2
            exit "$LS_EXIT"
          fi
      - name: Check release publication state
        id: release_state
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
        run: |
          set -eu

          write_summary() {
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### GitHub Release Publication"
                echo "- **Outcome**: $1"
                echo "- **Release tag**: \`$TAG\`"
                echo "- **Target SHA**: \`${TARGET_SHA:-${GITHUB_SHA:-unknown}}\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="${INPUT_TAG:-}"
          fi
          if [ -z "$TAG" ]; then
            if [ "${REF_TYPE:-}" = "tag" ]; then
              TAG="${REF_NAME:-}"
            elif [ -s VERSION ] && [ -n "$(tr -d '[:space:]' < VERSION)" ]; then
              TAG="v$(tr -d '[:space:]' < VERSION)"
            fi
          fi
          if [ -z "$TAG" ]; then
            echo "Error: Release tag could not be determined" >&2
            exit 1
          fi

          VIEW_ERR_FILE="$(mktemp)"
          trap 'rm -f "$VIEW_ERR_FILE"' EXIT

          SHOULD_PUBLISH="false"
          if VIEW_OUT="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>"$VIEW_ERR_FILE")"; then
            NORMALIZED_VIEW="$(printf '%s' "$VIEW_OUT" | tr -d '[:space:]')"
            case "$NORMALIZED_VIEW" in
              true|*'{"isDraft":true}'*)
                echo "Draft release $TAG found under release lock; proceeding with attestation and promotion."
                SHOULD_PUBLISH="true"
                ;;
              false|*'{"isDraft":false}'*)
                echo "Release $TAG is already published; skipping duplicate download, attestation, and publication."
                SHOULD_PUBLISH="false"
                write_summary "Skipped duplicate attestation and publication (already published)"
                ;;
              *)
                echo "Error: Unexpected gh release view output for '$TAG': $VIEW_OUT" >&2
                exit 1
                ;;
            esac
          else
            if grep -Eqi 'release not found|not found|404' "$VIEW_ERR_FILE"; then
              echo "Release $TAG is unpublished under release lock; proceeding with attestation and publication."
              SHOULD_PUBLISH="true"
            else
              cat "$VIEW_ERR_FILE" >&2
              exit 1
            fi
          fi

          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.release_state.outputs.should_publish == 'true'
        with:
          name: release-artifacts
          path: dist/release
      - name: Verify downloaded artifact checksums
        if: steps.release_state.outputs.should_publish == 'true'
        run: |
          set -eu
          if [ ! -d dist/release ]; then
            echo "Error: Downloaded release directory dist/release is missing" >&2
            exit 1
          fi
          if [ ! -s dist/release/SHA256SUMS ] || [ ! -s dist/release/checksums.sha256 ]; then
            echo "Error: Downloaded release checksum manifests are missing or empty" >&2
            exit 1
          fi
          if ! cmp -s dist/release/SHA256SUMS dist/release/checksums.sha256; then
            echo "Error: Downloaded SHA256SUMS and checksums.sha256 do not match" >&2
            exit 1
          fi

          MANIFEST_LIST="$(mktemp)"
          ACTUAL_LIST="$(mktemp)"
          trap 'rm -f "$MANIFEST_LIST" "$ACTUAL_LIST"' EXIT

          awk '{
            if (NF < 2 || $1 !~ /^[0-9a-f]{64}$/) {
              exit 2
            }
            sub(/^[0-9a-f]{64}  /, "", $0)
            if ($0 == "" || $0 ~ /\// || $0 ~ /^\./) {
              exit 2
            }
            print $0
          }' dist/release/SHA256SUMS | LC_ALL=C sort -u > "$MANIFEST_LIST" || {
            echo "Error: Malformed entry in dist/release/SHA256SUMS" >&2
            exit 1
          }

          if [ ! -s "$MANIFEST_LIST" ]; then
            echo "Error: No archive entries listed in dist/release/SHA256SUMS" >&2
            exit 1
          fi

          for ENTRY in dist/release/* dist/release/.[!.]* dist/release/..?*; do
            [ -e "$ENTRY" ] || [ -L "$ENTRY" ] || continue
            if [ -L "$ENTRY" ] || [ ! -f "$ENTRY" ]; then
              echo "Error: Non-regular file or symlink in dist/release: $ENTRY" >&2
              exit 1
            fi
            BASENAME="${ENTRY#dist/release/}"
            case "$BASENAME" in
              .*)
                echo "Error: Unexpected hidden file in dist/release: $BASENAME" >&2
                exit 1
                ;;
              manifest.json|SHA256SUMS|checksums.sha256)
                ;;
              *)
                printf '%s\n' "$BASENAME" >> "$ACTUAL_LIST"
                ;;
            esac
          done

          LC_ALL=C sort -u "$ACTUAL_LIST" -o "$ACTUAL_LIST"
          if ! cmp -s "$MANIFEST_LIST" "$ACTUAL_LIST"; then
            echo "Error: Downloaded files in dist/release do not match SHA256SUMS entries" >&2
            exit 1
          fi

          if [ -f VERSION ] && [ ! -s dist/release/manifest.json ]; then
            echo "Error: Downloaded dist/release/manifest.json is missing or empty" >&2
            exit 1
          fi

          if [ -s dist/release/manifest.json ]; then
            PY_BIN="${PYTHON_BIN:-}"
            if [ -z "$PY_BIN" ]; then
              if command -v python3 >/dev/null 2>&1; then
                PY_BIN="python3"
              elif command -v python >/dev/null 2>&1; then
                PY_BIN="python"
              else
                echo "Error: python3 is required to verify dist/release/manifest.json" >&2
                exit 1
              fi
            fi
            set -- "$PY_BIN" -S scripts/fred.py verify-release dist/release/manifest.json --require-licensing
            if [ -f VERSION ]; then
              set -- "$@" --expected-version "$(tr -d '[:space:]' < VERSION)"
            fi
            "$@"
          fi

          (
            cd dist/release
            sha256sum -c SHA256SUMS
            sha256sum -c checksums.sha256
          )
      - name: Attest build provenance
        if: steps.release_state.outputs.should_publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/release/*'
      - name: Publish GitHub Release
        if: steps.release_state.outputs.should_publish == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -eu

          write_summary() {
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              {
                echo "### GitHub Release Publication"
                echo "- **Outcome**: $1"
                echo "- **Release tag**: \`$TAG\`"
                echo "- **Target SHA**: \`$TARGET_SHA\`"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          if [ ! -s VERSION ] || [ -z "$(tr -d '[:space:]' < VERSION)" ]; then
            echo "Error: VERSION file is missing or empty in repository root" >&2
            exit 1
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          EXPECTED_TAG="v${VERSION}"

          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="${INPUT_TAG:-}"
          fi
          if [ -z "$TAG" ]; then
            if [ "${REF_TYPE:-}" = "tag" ]; then
              TAG="${REF_NAME:-}"
            else
              TAG="$EXPECTED_TAG"
            fi
          fi

          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Error: Release tag '$TAG' does not match expected tag '$EXPECTED_TAG' based on VERSION" >&2
            exit 1
          fi

          TARGET_SHA="${TARGET_SHA:-${GITHUB_SHA:-}}"
          if [ -z "$TARGET_SHA" ] || ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Error: Valid 40-character TARGET_SHA is required to publish a release" >&2
            exit 1
          fi

          HEAD_SHA="$(git rev-parse --verify HEAD 2>/dev/null || true)"
          if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then
            echo "Error: Checked-out HEAD '${HEAD_SHA:-none}' does not match verified target_sha '$TARGET_SHA'" >&2
            exit 1
          fi

          set -- dist/release/*
          if [ ! -e "$1" ]; then
            echo "Error: No release artifacts found in dist/release" >&2
            exit 1
          fi

          if [ -n "${GH_TOKEN:-}" ]; then
            SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"
            SERVER_URL="${SERVER_URL%/}"
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH_HEADER"
          fi

          FETCH_ERR_FILE="$(mktemp)"
          VIEW_ERR_FILE="$(mktemp)"
          ASSETS_FILE="$(mktemp)"
          trap 'rm -f "$FETCH_ERR_FILE" "$VIEW_ERR_FILE" "$ASSETS_FILE"' EXIT
          FETCH_OK="true"
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null || true)" = "true" ]; then
            git fetch --unshallow --tags --force origin "+refs/heads/main:refs/remotes/origin/main" >/dev/null 2>"$FETCH_ERR_FILE" || FETCH_OK="false"
          else
            git fetch --tags --force origin "+refs/heads/main:refs/remotes/origin/main" >/dev/null 2>"$FETCH_ERR_FILE" || FETCH_OK="false"
          fi
          if [ "$FETCH_OK" != "true" ]; then
            echo "Error: Failed to fetch full history and tags for origin/main: $(cat "$FETCH_ERR_FILE")" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TARGET_SHA" refs/remotes/origin/main >/dev/null 2>&1; then
            echo "Error: Commit '$TARGET_SHA' is not an ancestor of origin/main" >&2
            exit 1
          fi

          if [ "${EVENT_NAME:-}" = "workflow_run" ]; then
            if { [ -n "${WORKFLOW_CONCLUSION:-}" ] && [ "$WORKFLOW_CONCLUSION" != "success" ]; } || \
               { [ -n "${WORKFLOW_EVENT:-}" ] && [ "$WORKFLOW_EVENT" != "push" ]; } || \
               { [ -n "${WORKFLOW_HEAD_BRANCH:-}" ] && [ "$WORKFLOW_HEAD_BRANCH" != "main" ]; }; then
              echo "Error: Refusing release publication for unverified workflow_run context" >&2
              exit 1
            fi
          fi

          REMOTE_TAG_EXISTS="false"
          LS_EXIT=0
          git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1 || LS_EXIT=$?
          if [ "$LS_EXIT" -eq 0 ]; then
            REMOTE_TAG_EXISTS="true"
            git fetch --force --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1 || \
              git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1
            REMOTE_TAG_SHA="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
            if [ "$REMOTE_TAG_SHA" != "$TARGET_SHA" ]; then
              if { [ "${EVENT_NAME:-push}" = "push" ] || [ "${EVENT_NAME:-}" = "workflow_run" ]; } && [ "${REF_TYPE:-}" = "branch" ] && [ "${REF_NAME:-}" = "main" ] && git merge-base --is-ancestor "$REMOTE_TAG_SHA" refs/remotes/origin/main >/dev/null 2>&1; then
                if VIEW_OUT="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>"$VIEW_ERR_FILE")"; then
                  NORMALIZED_VIEW="$(printf '%s' "$VIEW_OUT" | tr -d '[:space:]')"
                  case "$NORMALIZED_VIEW" in
                    false|*'{"isDraft":false}'*)
                      echo "Release $TAG is already published; skipping duplicate publication."
                      write_summary "Skipped duplicate publication (already published)"
                      exit 0
                      ;;
                    true|*'{"isDraft":true}'*)
                      ;;
                    *)
                      echo "Error: Unexpected gh release view output for '$TAG': $VIEW_OUT" >&2
                      exit 1
                      ;;
                  esac
                else
                  if ! grep -Eqi 'release not found|not found|404' "$VIEW_ERR_FILE"; then
                    cat "$VIEW_ERR_FILE" >&2
                    exit 1
                  fi
                fi
              fi
              echo "Error: Remote tag 'refs/tags/$TAG' points to '$REMOTE_TAG_SHA', expected '$TARGET_SHA'" >&2
              exit 1
            fi
          elif [ "$LS_EXIT" -eq 2 ] && { [ "${EVENT_NAME:-push}" = "push" ] || [ "${EVENT_NAME:-}" = "workflow_run" ]; } && [ "${REF_TYPE:-}" = "branch" ] && [ "${REF_NAME:-}" = "main" ]; then
            REMOTE_TAG_EXISTS="false"
          elif [ "$LS_EXIT" -eq 2 ]; then
            echo "Error: Remote tag 'refs/tags/$TAG' does not exist on origin" >&2
            exit 1
          else
            echo "Error: Failed to check remote tags on origin (exit $LS_EXIT)" >&2
            exit "$LS_EXIT"
          fi

          TAG_NO_BUILD="${TAG%%+*}"
          IS_PRERELEASE="false"
          case "$TAG_NO_BUILD" in
            *-*)
              IS_PRERELEASE="true"
              ;;
          esac

          NOTES_FILE="docs/release-notes-${VERSION}.md"
          if VIEW_OUT="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>"$VIEW_ERR_FILE")"; then
            NORMALIZED_VIEW="$(printf '%s' "$VIEW_OUT" | tr -d '[:space:]')"
            case "$NORMALIZED_VIEW" in
              true|*'{"isDraft":true}'*)
                ASSETS_OUT="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>"$VIEW_ERR_FILE")" || {
                  cat "$VIEW_ERR_FILE" >&2
                  exit 1
                }
                printf '%s\n' "$ASSETS_OUT" | tr -d '\r' > "$ASSETS_FILE"
                while IFS= read -r ASSET_NAME || [ -n "$ASSET_NAME" ]; do
                  [ -n "$ASSET_NAME" ] || continue
                  case "$ASSET_NAME" in
                    */*|*\\*|*..*|.)
                      echo "Error: Unsafe draft asset name '$ASSET_NAME' in release '$TAG'" >&2
                      exit 1
                      ;;
                  esac
                  if [ ! -f "dist/release/$ASSET_NAME" ] || [ -L "dist/release/$ASSET_NAME" ]; then
                    gh release delete-asset "$TAG" "$ASSET_NAME" --yes
                  fi
                done < "$ASSETS_FILE"
                gh release upload "$TAG" dist/release/* --clobber
                set -- gh release edit "$TAG" \
                  --draft=false \
                  --title "$TAG" \
                  --target "$TARGET_SHA"
                if [ "$REMOTE_TAG_EXISTS" = "true" ]; then
                  set -- "$@" --verify-tag
                fi
                if [ "$IS_PRERELEASE" = "true" ]; then
                  set -- "$@" --prerelease
                fi
                if [ -f "$NOTES_FILE" ]; then
                  set -- "$@" --notes-file "$NOTES_FILE"
                fi
                "$@"
                write_summary "Promoted draft GitHub Release"
                ;;
              false|*'{"isDraft":false}'*)
                echo "Release $TAG is already published; skipping duplicate publication."
                write_summary "Skipped duplicate publication (already published)"
                ;;
              *)
                echo "Error: Unexpected gh release view output for '$TAG': $VIEW_OUT" >&2
                exit 1
                ;;
            esac
          else
            if grep -Eqi 'release not found|not found|404' "$VIEW_ERR_FILE"; then
              set -- gh release create "$TAG" dist/release/* \
                --title "$TAG" \
                --target "$TARGET_SHA"
              if [ "$REMOTE_TAG_EXISTS" = "true" ]; then
                set -- "$@" --verify-tag
              fi
              if [ "$IS_PRERELEASE" = "true" ]; then
                set -- "$@" --prerelease
              fi
              if [ -f "$NOTES_FILE" ]; then
                set -- "$@" --notes-file "$NOTES_FILE"
              else
                set -- "$@" --generate-notes
              fi
              "$@"
              write_summary "Published new GitHub Release"
            else
              cat "$VIEW_ERR_FILE" >&2
              exit 1
            fi
          fi
