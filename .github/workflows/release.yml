name: Prepare versioned skill bundles

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      pack:
        description: Pack to build
        type: choice
        options: [starter, async-correctness, backend-consistency, web-review, release-readiness, verified-fixes, full-audit, complete]
        default: complete
      publish:
        description: Create a draft release (requires existing v<VERSION> tag and LICENSE)
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8
  RELEASE_PACK: ${{ inputs.pack || 'complete' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate source and fixtures
        run: |
          python scripts/sync_audit_resources.py --check
          python scripts/build_catalog.py --check
          python scripts/build_experience.py --check
          python scripts/validate_skills.py
          python -m unittest discover -s tests -v
      - name: Build selected pack
        run: python scripts/fred.py release --pack "$RELEASE_PACK" --output dist/release
      - run: python scripts/fred.py verify-release dist/release/manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-bundles
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Require owner license and matching tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          expected = 'refs/tags/v' + Path('VERSION').read_text().strip()
          if os.environ['RELEASE_REF'] != expected:
              raise SystemExit('Draft publication requires an existing tag matching VERSION')
          if not Path('LICENSE').is_file() or not Path('LICENSE').read_text().strip():
              raise SystemExit('Owner must select a nonempty LICENSE before release publication')
          PY
      - run: python -m pip install -r requirements-dev.txt
      - name: Rebuild reviewed version and verify
        run: |
          python scripts/fred.py release --pack "$RELEASE_PACK" --output dist/release
          python scripts/fred.py verify-release dist/release/manifest.json
      - name: Create draft only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/release/* --draft --verify-tag --title "$RELEASE_TAG" --notes-file docs/release-notes-0.2.0.md
