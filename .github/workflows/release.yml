name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (defaults to v<VERSION>)'
        type: string
        required: false
      publish:
        description: 'Publish or promote the GitHub Release (false builds read-only workflow artifacts only)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
      should_publish: ${{ steps.gate.outputs.should_publish }}
      release_tag: ${{ steps.gate.outputs.release_tag }}
      target_sha: ${{ steps.gate.outputs.target_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Evaluate release preflight gate
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.sha }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -eu

          validate_tag_syntax() {
            CANDIDATE_TAG="$1"
            case "$CANDIDATE_TAG" in
              ""|*[!0-9A-Za-z._+-]*|v)
                echo "Error: Invalid release tag syntax '$CANDIDATE_TAG' (expected v<VERSION>)" >&2
                exit 1
                ;;
              v[0-9]*)
                ;;
              *)
                echo "Error: Invalid release tag syntax '$CANDIDATE_TAG' (expected v<VERSION>)" >&2
                exit 1
                ;;
            esac
            if ! printf '%s' "$CANDIDATE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z._-]+)?(\+[0-9A-Za-z._-]+)?$' || ! git check-ref-format "refs/tags/$CANDIDATE_TAG"; then
              echo "Error: Invalid release tag syntax '$CANDIDATE_TAG' (expected v<VERSION>)" >&2
              exit 1
            fi
          }

          EVENT="${EVENT_NAME:-}"
          PUBLISH_INPUT="${INPUT_PUBLISH:-}"
          PUBLISH_REQUESTED="false"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$PUBLISH_INPUT" in
              true|TRUE|True)
                PUBLISH_REQUESTED="true"
                ;;
              false|FALSE|False|"")
                PUBLISH_REQUESTED="false"
                ;;
              *)
                echo "Error: Invalid publish input '$PUBLISH_INPUT' (expected true or false)" >&2
                exit 1
                ;;
            esac
          elif [ "$EVENT" = "push" ]; then
            PUBLISH_REQUESTED="true"
          else
            case "$PUBLISH_INPUT" in
              true|TRUE|True)
                PUBLISH_REQUESTED="true"
                ;;
              false|FALSE|False)
                PUBLISH_REQUESTED="false"
                ;;
              "")
                if [ "${REF_TYPE:-}" = "tag" ] || { [ "${REF_TYPE:-}" = "branch" ] && [ "${REF_NAME:-}" = "main" ]; }; then
                  PUBLISH_REQUESTED="true"
                fi
                ;;
              *)
                echo "Error: Invalid publish input '$PUBLISH_INPUT' (expected true or false)" >&2
                exit 1
                ;;
            esac
          fi

          if [ "$PUBLISH_REQUESTED" = "false" ]; then
            DISPATCH_TAG="${INPUT_TAG:-}"
            if [ -n "$DISPATCH_TAG" ]; then
              validate_tag_syntax "$DISPATCH_TAG"
              if ! git ls-remote --exit-code --refs origin "refs/tags/$DISPATCH_TAG" >/dev/null 2>&1; then
                echo "Error: Remote tag 'refs/tags/$DISPATCH_TAG' does not exist on origin" >&2
                exit 1
              fi
              git fetch --force --depth=1 origin "refs/tags/$DISPATCH_TAG:refs/tags/$DISPATCH_TAG" >/dev/null 2>&1 || \
                git fetch --force origin "refs/tags/$DISPATCH_TAG:refs/tags/$DISPATCH_TAG" >/dev/null 2>&1
              TARGET_SHA="$(git rev-parse --verify "refs/tags/$DISPATCH_TAG^{commit}")"
            else
              TARGET_SHA="${WORKFLOW_SHA:-${GITHUB_SHA:-}}"
              if [ -z "$TARGET_SHA" ]; then
                TARGET_SHA="$(git rev-parse --verify HEAD)"
              fi
            fi

            if ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "Error: Resolved target_sha '$TARGET_SHA' is not a valid 40-character commit SHA" >&2
              exit 1
            fi

            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              {
                echo "should_build=true"
                echo "should_publish=false"
                echo "release_tag=$DISPATCH_TAG"
                echo "target_sha=$TARGET_SHA"
              } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            if [ "${REF_TYPE:-}" = "tag" ]; then
              TAG="${REF_NAME:-}"
            else
              if [ ! -s VERSION ] || [ -z "$(tr -d '[:space:]' < VERSION)" ]; then
                echo "Error: VERSION file is missing or empty in repository root" >&2
                exit 1
              fi
              TAG="v$(tr -d '[:space:]' < VERSION)"
            fi
          fi

          validate_tag_syntax "$TAG"

          LS_EXIT=0
          git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1 || LS_EXIT=$?
          if [ "$LS_EXIT" -eq 0 ]; then
            git fetch --force --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1 || \
              git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1
            TARGET_SHA="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          elif [ "$LS_EXIT" -eq 2 ] && [ "${REF_TYPE:-}" = "branch" ] && [ "${REF_NAME:-}" = "main" ]; then
            if [ ! -s VERSION ] || [ -z "$(tr -d '[:space:]' < VERSION)" ]; then
              echo "Error: VERSION file is missing or empty on main" >&2
              exit 1
            fi
            MAIN_EXPECTED_TAG="v$(tr -d '[:space:]' < VERSION)"
            if [ "$TAG" != "$MAIN_EXPECTED_TAG" ]; then
              echo "Error: Remote tag 'refs/tags/$TAG' does not exist on origin and does not match main VERSION '$MAIN_EXPECTED_TAG'" >&2
              exit 1
            fi
            TARGET_SHA="${WORKFLOW_SHA:-${GITHUB_SHA:-}}"
            if [ -z "$TARGET_SHA" ]; then
              TARGET_SHA="$(git rev-parse --verify HEAD)"
            fi
          elif [ "$LS_EXIT" -eq 2 ]; then
            echo "Error: Remote tag 'refs/tags/$TAG' does not exist on origin" >&2
            exit 1
          else
            echo "Error: Failed to query remote tag 'refs/tags/$TAG' on origin (exit $LS_EXIT)" >&2
            exit "$LS_EXIT"
          fi

          if ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Error: Resolved target_sha '$TARGET_SHA' is not a valid 40-character commit SHA" >&2
            exit 1
          fi

          if [ "$(git cat-file -t "$TARGET_SHA:LICENSE" 2>/dev/null || true)" != "blob" ]; then
            echo "Error: LICENSE file is missing at target commit $TARGET_SHA" >&2
            exit 1
          fi
          if [ -z "$(git cat-file -p "$TARGET_SHA:LICENSE" | tr -d '[:space:]')" ]; then
            echo "Error: LICENSE file is empty or whitespace at target commit $TARGET_SHA" >&2
            exit 1
          fi

          if [ "$(git cat-file -t "$TARGET_SHA:VERSION" 2>/dev/null || true)" != "blob" ]; then
            echo "Error: VERSION file is missing at target commit $TARGET_SHA" >&2
            exit 1
          fi
          VERSION_AT_TARGET="$(git cat-file -p "$TARGET_SHA:VERSION" | tr -d '[:space:]')"
          if [ -z "$VERSION_AT_TARGET" ]; then
            echo "Error: VERSION file is empty at target commit $TARGET_SHA" >&2
            exit 1
          fi

          EXPECTED_TAG="v$VERSION_AT_TARGET"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Error: Release tag '$TAG' does not match expected tag '$EXPECTED_TAG' based on VERSION at $TARGET_SHA" >&2
            exit 1
          fi

          VIEW_ERR_FILE="$(mktemp)"
          trap 'rm -f "$VIEW_ERR_FILE"' EXIT
          SHOULD_BUILD="false"
          SHOULD_PUBLISH="false"
          if VIEW_OUT="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>"$VIEW_ERR_FILE")"; then
            NORMALIZED_VIEW="$(printf '%s' "$VIEW_OUT" | tr -d '[:space:]')"
            case "$NORMALIZED_VIEW" in
              true|*'{"isDraft":true}'*)
                echo "Draft release $TAG found; scheduling build and publication."
                SHOULD_BUILD="true"
                SHOULD_PUBLISH="true"
                ;;
              false|*'{"isDraft":false}'*)
                echo "Release $TAG is already published; skipping duplicate build and publication."
                SHOULD_BUILD="false"
                SHOULD_PUBLISH="false"
                ;;
              *)
                echo "Error: Unexpected gh release view output for '$TAG': $VIEW_OUT" >&2
                exit 1
                ;;
            esac
          else
            if grep -Eqi 'release not found|not found|404' "$VIEW_ERR_FILE"; then
              echo "Release $TAG is unpublished; scheduling build and publication."
              SHOULD_BUILD="true"
              SHOULD_PUBLISH="true"
            else
              cat "$VIEW_ERR_FILE" >&2
              exit 1
            fi
          fi

          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            {
              echo "should_build=$SHOULD_BUILD"
              echo "should_publish=$SHOULD_PUBLISH"
              echo "release_tag=$TAG"
              echo "target_sha=$TARGET_SHA"
            } >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate source and fixtures
        run: make check
      - name: Package release assets
        run: python scripts/fred.py release --all --output dist/release
      - name: Verify release manifest and checksums
        run: |
          python scripts/fred.py verify-release dist/release/manifest.json
          cd dist/release
          sha256sum -c SHA256SUMS
          sha256sum -c checksums.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [preflight, build]
    if: needs.preflight.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}
          persist-credentials: false
      - name: Verify release prerequisites
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
        run: |
          set -eu

          if [ ! -s LICENSE ] || [ -z "$(tr -d '[:space:]' < LICENSE)" ]; then
            echo "Error: LICENSE file is missing or empty in repository root" >&2
            exit 1
          fi

          if [ ! -s VERSION ] || [ -z "$(tr -d '[:space:]' < VERSION)" ]; then
            echo "Error: VERSION file is missing or empty in repository root" >&2
            exit 1
          fi

          if [ -n "${RELEASE_TAG:-}" ] && [ -n "${INPUT_TAG:-}" ] && [ "$RELEASE_TAG" != "$INPUT_TAG" ]; then
            echo "Error: Release tag '$INPUT_TAG' does not match preflight tag '$RELEASE_TAG'" >&2
            exit 1
          fi

          EXPECTED_TAG="v$(tr -d '[:space:]' < VERSION)"
          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="${INPUT_TAG:-}"
          fi
          if [ -z "$TAG" ]; then
            if [ "${REF_TYPE:-}" = "tag" ]; then
              TAG="${REF_NAME:-}"
            else
              TAG="$EXPECTED_TAG"
            fi
          fi

          case "$TAG" in
            ""|*[!0-9A-Za-z._+-]*|v)
              echo "Error: Invalid release tag syntax '$TAG' (expected v<VERSION>)" >&2
              exit 1
              ;;
            v[0-9]*)
              ;;
            *)
              echo "Error: Invalid release tag syntax '$TAG' (expected v<VERSION>)" >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z._-]+)?(\+[0-9A-Za-z._-]+)?$' || ! git check-ref-format "refs/tags/$TAG"; then
            echo "Error: Invalid release tag syntax '$TAG' (expected v<VERSION>)" >&2
            exit 1
          fi

          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Error: Release tag '$TAG' does not match expected tag '$EXPECTED_TAG' based on VERSION" >&2
            exit 1
          fi

          if [ -z "${TARGET_SHA:-}" ] || ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Error: Verified 40-character TARGET_SHA is missing or invalid" >&2
            exit 1
          fi

          HEAD_SHA="$(git rev-parse --verify HEAD 2>/dev/null || true)"
          if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then
            echo "Error: Checked-out HEAD '${HEAD_SHA:-none}' does not match verified target_sha '$TARGET_SHA'" >&2
            exit 1
          fi
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          name: release-artifacts
          path: dist/release
      - name: Verify downloaded artifact checksums
        run: |
          set -eu
          if [ ! -s dist/release/SHA256SUMS ] || [ ! -s dist/release/checksums.sha256 ]; then
            echo "Error: Downloaded release checksum manifests are missing or empty" >&2
            exit 1
          fi
          cd dist/release
          sha256sum -c SHA256SUMS
          sha256sum -c checksums.sha256
      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: 'dist/release/*'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
        run: |
          set -eu

          if [ ! -s VERSION ] || [ -z "$(tr -d '[:space:]' < VERSION)" ]; then
            echo "Error: VERSION file is missing or empty in repository root" >&2
            exit 1
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          EXPECTED_TAG="v${VERSION}"

          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="${INPUT_TAG:-}"
          fi
          if [ -z "$TAG" ]; then
            if [ "${REF_TYPE:-}" = "tag" ]; then
              TAG="${REF_NAME:-}"
            else
              TAG="$EXPECTED_TAG"
            fi
          fi

          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Error: Release tag '$TAG' does not match expected tag '$EXPECTED_TAG' based on VERSION" >&2
            exit 1
          fi

          if [ -z "${TARGET_SHA:-}" ] || ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Error: Valid 40-character TARGET_SHA is required to publish a release" >&2
            exit 1
          fi

          HEAD_SHA="$(git rev-parse --verify HEAD 2>/dev/null || true)"
          if [ "$HEAD_SHA" != "$TARGET_SHA" ]; then
            echo "Error: Checked-out HEAD '${HEAD_SHA:-none}' does not match verified target_sha '$TARGET_SHA'" >&2
            exit 1
          fi

          set -- dist/release/*
          if [ ! -e "$1" ]; then
            echo "Error: No release artifacts found in dist/release" >&2
            exit 1
          fi

          if [ -n "${GH_TOKEN:-}" ]; then
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH_HEADER"
          fi

          LS_EXIT=0
          git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1 || LS_EXIT=$?
          if [ "$LS_EXIT" -eq 0 ]; then
            git fetch --force --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1 || \
              git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1
            REMOTE_TAG_SHA="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
            if [ "$REMOTE_TAG_SHA" != "$TARGET_SHA" ]; then
              echo "Error: Remote tag 'refs/tags/$TAG' points to '$REMOTE_TAG_SHA', expected '$TARGET_SHA'" >&2
              exit 1
            fi
          elif [ "$LS_EXIT" -eq 2 ] && [ "${REF_TYPE:-}" = "branch" ] && [ "${REF_NAME:-}" = "main" ]; then
            git tag -f "$TAG" "$TARGET_SHA"
            git push origin "refs/tags/$TAG"
          elif [ "$LS_EXIT" -eq 2 ]; then
            echo "Error: Remote tag 'refs/tags/$TAG' does not exist on origin" >&2
            exit 1
          else
            echo "Error: Failed to check remote tags on origin (exit $LS_EXIT)" >&2
            exit "$LS_EXIT"
          fi

          NOTES_FILE="docs/release-notes-${VERSION}.md"
          VIEW_ERR_FILE="$(mktemp)"
          trap 'rm -f "$VIEW_ERR_FILE"' EXIT
          if VIEW_OUT="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>"$VIEW_ERR_FILE")"; then
            NORMALIZED_VIEW="$(printf '%s' "$VIEW_OUT" | tr -d '[:space:]')"
            case "$NORMALIZED_VIEW" in
              true|*'{"isDraft":true}'*)
                gh release upload "$TAG" dist/release/* --clobber
                if [ -f "$NOTES_FILE" ]; then
                  gh release edit "$TAG" \
                    --draft=false \
                    --title "$TAG" \
                    --target "$TARGET_SHA" \
                    --notes-file "$NOTES_FILE"
                else
                  gh release edit "$TAG" \
                    --draft=false \
                    --title "$TAG" \
                    --target "$TARGET_SHA"
                fi
                ;;
              false|*'{"isDraft":false}'*)
                echo "Release $TAG is already published; skipping duplicate publication."
                ;;
              *)
                echo "Error: Unexpected gh release view output for '$TAG': $VIEW_OUT" >&2
                exit 1
                ;;
            esac
          else
            if grep -Eqi 'release not found|not found|404' "$VIEW_ERR_FILE"; then
              if [ -f "$NOTES_FILE" ]; then
                gh release create "$TAG" dist/release/* \
                  --title "$TAG" \
                  --verify-tag \
                  --target "$TARGET_SHA" \
                  --notes-file "$NOTES_FILE"
              else
                gh release create "$TAG" dist/release/* \
                  --title "$TAG" \
                  --verify-tag \
                  --target "$TARGET_SHA" \
                  --generate-notes
              fi
            else
              cat "$VIEW_ERR_FILE" >&2
              exit 1
            fi
          fi
