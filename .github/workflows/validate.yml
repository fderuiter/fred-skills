name: Validate skill packages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: skills-${{ github.workflow }}-${{ (github.event_name == 'push' || github.ref == 'refs/heads/main') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run pre-commit validation
        run: pre-commit run --all-files
      - name: Lint Python sources
        run: ruff check .
      - name: Verify code formatting
        run: ruff format --check .
      - name: Check skill packages and test suites
        if: runner.os != 'Windows'
        run: make check
      - name: Check skill packages and test suites (Windows fallback)
        if: runner.os == 'Windows'
        run: |
          python scripts/sync_audit_resources.py --check
          python scripts/build_catalog.py --check
          python scripts/build_experience.py --check
          python scripts/validate_skills.py --telemetry validation-telemetry.json
          python scripts/check_doc_links.py
          python scripts/verify_doc_snippets.py
          python -m unittest discover -s tests -v
      - name: Execute original, correction, and safe controls
        run: python -c "import os, subprocess, sys; subprocess.run([sys.executable, 'examples/walkthrough/run_demo.py', '--output', os.path.join(os.environ['RUNNER_TEMP'], 'fred-demo')], check=True)"
      - name: Build and verify a standalone pack
        run: python -c "import os, subprocess, sys; p=os.path.join(os.environ['RUNNER_TEMP'], 'fred-pack'); subprocess.run([sys.executable, 'scripts/fred.py', 'release', '--pack', 'starter', '--output', p], check=True); subprocess.run([sys.executable, 'scripts/fred.py', 'verify-release', os.path.join(p, 'manifest.json')], check=True)"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-browser.txt
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements-browser.txt') }}
      - name: Install isolated browser-test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-browser.txt
      - name: Install Playwright browser and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - name: Exercise reports and discovery in Chromium
        run: python tests/browser_check.py
