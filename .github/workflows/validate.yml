name: Validate skill packages

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      ref:
        description: 'Optional Git ref or commit SHA to check out'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: skills-${{ github.workflow != 'Validate skill packages' && 'validate-' || '' }}${{ github.workflow }}-${{ (github.workflow != 'Validate skill packages' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && github.sha || github.ref }}${{ github.workflow != 'Validate skill packages' && '-' || '' }}${{ github.workflow != 'Validate skill packages' && github.run_id || '' }}
  cancel-in-progress: ${{ github.workflow == 'Validate skill packages' && github.event_name != 'merge_group' && github.ref != 'refs/heads/main' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify clean merge tree against base branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: git merge-tree --write-tree "origin/$BASE_BRANCH" HEAD
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify Python and Markdown formatting
        env:
          SKIP: ruff-lint,mypy,sync-audit-resources,build-catalog,build-experience,validate-skills,check-doc-links,verify-doc-snippets,verify-workflow-actions,unit-tests
        run: pre-commit run --all-files
      - name: Lint Python sources
        run: python scripts/run_checks.py --phase lint
      - name: Check Python static types
        run: python scripts/run_checks.py --phase typecheck
      - name: Validate skill packages and catalogs
        shell: bash
        env:
          BASE_REF: ${{ (inputs.ref != '' && format('{0}~1', inputs.ref)) || (github.event_name == 'pull_request' && format('origin/{0}', github.base_ref)) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || ((github.ref_type == 'tag' || startsWith(github.ref, 'refs/tags/')) && 'HEAD~1') || github.event.before }}
        run: python scripts/run_checks.py --phase packages --telemetry validation-telemetry.json --base-ref "$BASE_REF" --step-summary
      - name: Upload skill validation telemetry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-telemetry-${{ matrix.os }}-py${{ matrix.python-version }}
          path: validation-telemetry.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify documentation links and snippets
        run: python scripts/run_checks.py --phase docs
      - name: Verify Makefile syntax
        if: runner.os != 'Windows'
        run: make -n check
      - name: Run unit and documentation test suites
        run: python scripts/run_checks.py --phase tests
      - name: Verify workflow action pins upstream
        if: github.workflow == 'Validate skill packages' && github.event_name != 'workflow_call' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        env:
          BASE_REF: ${{ (github.event_name == 'pull_request' && format('origin/{0}', github.base_ref)) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || github.event.before }}
        run: |
          RESOLVED_BASE="$BASE_REF"
          if [ -z "$RESOLVED_BASE" ] || ! git cat-file -e "${RESOLVED_BASE}^{commit}" 2>/dev/null; then
            RESOLVED_BASE="HEAD~1"
          fi
          python scripts/check_workflow_pins.py --verify-remote --changed-from "$RESOLVED_BASE"
      - name: Execute original, correction, and safe controls
        run: python -c "import os, subprocess, sys; subprocess.run([sys.executable, 'examples/walkthrough/run_demo.py', '--output', os.path.join(os.environ['RUNNER_TEMP'], 'fred-demo')], check=True)"
      - name: Build and verify a standalone pack
        run: python -c "import os, subprocess, sys; p=os.path.join(os.environ['RUNNER_TEMP'], 'fred-pack'); subprocess.run([sys.executable, 'scripts/fred.py', 'release', '--pack', 'starter', '--output', p], check=True); subprocess.run([sys.executable, 'scripts/fred.py', 'verify-release', os.path.join(p, 'manifest.json')], check=True)"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-browser.txt
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements-browser.txt') }}
      - name: Install isolated browser-test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-browser.txt
      - name: Install Playwright browser and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          python -m playwright install chromium
          if ! python -m playwright install-deps --dry-run chromium; then
            python -m playwright install-deps chromium
          fi
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          if ! python -m playwright install-deps --dry-run chromium; then
            python -m playwright install-deps chromium
          fi
      - name: Exercise reports and discovery in Chromium
        run: python tests/browser_check.py
