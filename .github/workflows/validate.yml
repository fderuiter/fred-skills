name: Validate skill packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'Optional Git ref or commit SHA to check out'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: skills-${{ github.workflow }}-${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONIOENCODING: utf-8

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify Python and Markdown formatting
        env:
          SKIP: ruff-lint,mypy,sync-audit-resources,build-catalog,build-experience,validate-skills,check-doc-links,verify-doc-snippets,verify-workflow-actions,unit-tests
        run: pre-commit run --all-files
      - name: Lint Python sources
        run: python scripts/run_checks.py --phase lint
      - name: Check Python static types
        run: python scripts/run_checks.py --phase typecheck
      - name: Validate skill packages and catalogs
        run: python scripts/run_checks.py --phase packages --telemetry validation-telemetry.json --base-ref "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}" --step-summary
      - name: Upload skill validation telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-telemetry-${{ matrix.os }}-py${{ matrix.python-version }}
          path: validation-telemetry.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify documentation links and snippets
        run: python scripts/run_checks.py --phase docs
      - name: Verify Makefile syntax
        if: runner.os != 'Windows'
        run: make -n check
      - name: Run unit and documentation test suites
        run: python scripts/run_checks.py --phase tests
      - name: Verify workflow action pins upstream
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/check_workflow_pins.py --verify-remote
      - name: Execute original, correction, and safe controls
        run: python -c "import os, subprocess, sys; subprocess.run([sys.executable, 'examples/walkthrough/run_demo.py', '--output', os.path.join(os.environ['RUNNER_TEMP'], 'fred-demo')], check=True)"
      - name: Build and verify a standalone pack
        run: python -c "import os, subprocess, sys; p=os.path.join(os.environ['RUNNER_TEMP'], 'fred-pack'); subprocess.run([sys.executable, 'scripts/fred.py', 'release', '--pack', 'starter', '--output', p], check=True); subprocess.run([sys.executable, 'scripts/fred.py', 'verify-release', os.path.join(p, 'manifest.json')], check=True)"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-browser.txt
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements-browser.txt') }}
      - name: Install isolated browser-test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-browser.txt
      - name: Install Playwright browser and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium
      - name: Exercise reports and discovery in Chromium
        run: python tests/browser_check.py
